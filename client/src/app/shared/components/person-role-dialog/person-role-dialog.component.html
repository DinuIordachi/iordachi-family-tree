
    <p-dialog
      [header]="'Assign Person'"
      [visible]="visible()"
      (visibleChange)="onVisibleChange($event)"
      [modal]="true"
      [style]="{ width: '450px' }">

      <form [formGroup]="form" (ngSubmit)="onSave()" class="flex flex-col gap-5 pt-4">
        <p-floatlabel variant="on">
          <p-autocomplete
            id="person"
            formControlName="person"
            [suggestions]="personSuggestions()"
            (completeMethod)="searchPersons($event)"
            optionLabel="lastName"
            [forceSelection]="true"
            styleClass="w-full"
            inputStyleClass="w-full">
            <ng-template #item let-person>
              {{ person.lastName }} {{ person.firstName }}
            </ng-template>
            <ng-template #selectedItem let-person>
              {{ person.lastName }} {{ person.firstName }}
            </ng-template>
          </p-autocomplete>
          <label for="person">Person</label>
        </p-floatlabel>

        <p-floatlabel variant="on">
          <p-select
            id="role"
            formControlName="roleId"
            [options]="filteredRoles()"
            optionLabel="name"
            optionValue="id"
            styleClass="w-full" />
          <label for="role">Role</label>
        </p-floatlabel>

        @if (scope() === 'garage') {
          <p-floatlabel variant="on">
            <p-inputnumber
              id="ownershipPercentage"
              formControlName="ownershipPercentage"
              [min]="0"
              [max]="100"
              suffix="%"
              styleClass="w-full"
              inputStyleClass="w-full" />
            <label for="ownershipPercentage">Ownership %</label>
          </p-floatlabel>
        }

        @if (scope() === 'association') {
          <p-floatlabel variant="on">
            <p-datepicker
              id="startDate"
              formControlName="startDate"
              dateFormat="yy-mm-dd"
              styleClass="w-full"
              inputStyleClass="w-full" />
            <label for="startDate">Start Date</label>
          </p-floatlabel>
        }

        <div class="flex justify-end gap-2 pt-2">
          <p-button label="Cancel" severity="secondary" (onClick)="onVisibleChange(false)" />
          <p-button label="Save" type="submit" [disabled]="form.invalid" [loading]="saving()" />
        </div>
      </form>
    </p-dialog>
