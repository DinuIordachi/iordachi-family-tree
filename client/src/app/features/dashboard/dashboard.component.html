<div class="grid grid-cols-12 gap-8">
  <!-- Welcome header -->
  <div class="col-span-12">
    @if (auth.currentUser()) {
      <h1 class="text-3xl font-bold text-color">Welcome, {{ auth.currentUser()!.firstName }}</h1>
      <p class="text-muted-color mt-1">Here's an overview of your family tree.</p>
    } @else {
      <h1 class="text-3xl font-bold text-color">Dashboard</h1>
    }
  </div>

  <!-- Stats widgets -->
  <app-stats-widget
    label="Family Members"
    [count]="familyMemberCount()"
    icon="pi pi-users"
    iconColor="var(--p-emerald-500)"
    iconBgClass="bg-emerald-100 dark:bg-emerald-400/10"
    link="/family-members"
  />

  <!-- Quick actions -->
  <div class="col-span-12">
    <div class="card">
      <h2 class="text-xl font-semibold text-color mb-4">Quick Actions</h2>
      <div class="flex flex-wrap gap-3">
        <p-button label="Manage Family Members" icon="pi pi-users" routerLink="/family-members" severity="primary" [outlined]="true" />
        <p-button label="View Family Tree" icon="pi pi-sitemap" routerLink="/tree" severity="secondary" [outlined]="true" />
      </div>
    </div>
  </div>
</div>
