
    <div class="grid grid-cols-12 gap-8">
      <!-- Welcome header -->
      <div class="col-span-12">
        @if (auth.currentUser()) {
          <h1 class="text-3xl font-bold text-color">Welcome, {{ auth.currentUser()!.firstName }}</h1>
          <p class="text-muted-color mt-1">Here's an overview of your data.</p>
        } @else {
          <h1 class="text-3xl font-bold text-color">Dashboard</h1>
        }
      </div>

      <!-- Stats widgets -->
      <app-stats-widget
        label="Garages"
        [count]="garageCount()"
        icon="pi pi-warehouse"
        iconColor="var(--p-blue-500)"
        iconBgClass="bg-blue-100 dark:bg-blue-400/10"
        link="/garages"
      />
      <app-stats-widget
        label="Persons"
        [count]="personCount()"
        icon="pi pi-users"
        iconColor="var(--p-orange-500)"
        iconBgClass="bg-orange-100 dark:bg-orange-400/10"
        link="/persons"
      />
      <app-stats-widget
        label="Associations"
        [count]="associationCount()"
        icon="pi pi-building"
        iconColor="var(--p-cyan-500)"
        iconBgClass="bg-cyan-100 dark:bg-cyan-400/10"
        link="/associations"
      />

      <!-- Quick actions -->
      <div class="col-span-12">
        <div class="card">
          <h2 class="text-xl font-semibold text-color mb-4">Quick Actions</h2>
          <div class="flex flex-wrap gap-3">
            <p-button label="Add Garage" icon="pi pi-plus" routerLink="/garages/create" severity="primary" [outlined]="true" />
            <p-button label="Add Person" icon="pi pi-plus" routerLink="/persons/create" severity="success" [outlined]="true" />
            <p-button label="Add Association" icon="pi pi-plus" routerLink="/associations/create" severity="help" [outlined]="true" />
          </div>
        </div>
      </div>
    </div>
