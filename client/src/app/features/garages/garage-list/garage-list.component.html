
    <div class="flex flex-col gap-4">
      <div class="card">
      <p-table
        [value]="garages()"
        [paginator]="true"
        [rows]="perPage()"
        [totalRecords]="totalRecords()"
        [lazy]="true"
        (onLazyLoad)="onPageChange($event)"
        [loading]="loading()"
        [globalFilterFields]="['name', 'city', 'cadastralNumber']"
        [rowHover]="true"
        dataKey="id"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} garages">

        <ng-template #caption>
          <div class="flex justify-between items-center">
            <h1>Garages</h1>

            <div class="flex gap-3">
              <p-iconfield>
                <p-inputicon class="pi pi-search" />
                <input pInputText type="text" placeholder="Search..." (input)="onSearch($event)" />
              </p-iconfield>
              <p-button label="Add Garage" icon="pi pi-plus" (onClick)="navigateToCreate()" />
            </div>
          </div>
        </ng-template>

        <ng-template #header>
          <tr>
            <th pSortableColumn="name">Name <p-sortIcon field="name" /></th>
            <th>Association</th>
            <th pSortableColumn="status">Status <p-sortIcon field="status" /></th>
            <th pSortableColumn="city">City <p-sortIcon field="city" /></th>
            <th>Address #</th>
            <th>Cadastral #</th>
            <th pSortableColumn="area">Area (m&sup2;) <p-sortIcon field="area" /></th>
            <th class="w-32">Actions</th>
          </tr>
        </ng-template>

        <ng-template #body let-garage>
          <tr>
            <td>{{ garage.name }}</td>
            <td>{{ garage.association?.name || '-' }}</td>
            <td>
              <p-tag [value]="formatStatus(garage.status)" [severity]="getStatusSeverity(garage.status)" />
            </td>
            <td>{{ garage.city }}</td>
            <td>{{ garage.addressNumber || '-' }}</td>
            <td>{{ garage.cadastralNumber }}</td>
            <td>{{ garage.area }}</td>
            <td>
              <div class="flex gap-1">
                <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="info"
                          (onClick)="navigateToEdit(garage.id)" />
                <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger"
                          (onClick)="confirmDelete(garage)" />
              </div>
            </td>
          </tr>
        </ng-template>

        <ng-template #emptymessage>
          <tr><td colspan="8" class="text-center p-4">No garages found.</td></tr>
        </ng-template>
      </p-table>

      </div>
      <app-confirm-dialog />
    </div>
