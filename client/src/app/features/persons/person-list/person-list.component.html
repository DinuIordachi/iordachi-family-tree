<div class="flex flex-col gap-4">
  <div class="card">
    <p-table
      [value]="persons()"
      [paginator]="true"
      [rows]="perPage()"
      [totalRecords]="totalRecords()"
      [lazy]="true"
      (onLazyLoad)="onPageChange($event)"
      [loading]="loading()"
      [rowHover]="true"
      dataKey="id"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} persons">

      <ng-template #caption>
        <div class="flex justify-between items-center">
          <h1>Persons</h1>

          <div class="flex gap-3">
            <p-iconfield>
              <p-inputicon class="pi pi-search" />
              <input pInputText type="text" placeholder="Search..." (input)="onSearch($event)" />
            </p-iconfield>
            <p-button label="Add Person" icon="pi pi-plus" (onClick)="navigateToCreate()" />
          </div>
        </div>
      </ng-template>

      <ng-template #header>
        <tr>
          <th pSortableColumn="lastName">Last Name
            <p-sortIcon field="lastName" />
          </th>
          <th pSortableColumn="firstName">First Name
            <p-sortIcon field="firstName" />
          </th>
          <th>Patronymic</th>
          <th>Name ID</th>
          <th>Contacts</th>
          <th>Garages</th>
          <th>Associations</th>
          <th class="w-32">Actions</th>
        </tr>
      </ng-template>

      <ng-template #body let-person>
        <tr>
          <td>{{ person.lastName }}</td>
          <td>{{ person.firstName }}</td>
          <td>{{ person.patronymic || '-' }}</td>
          <td>{{ person.nameId }}</td>
          <td>{{ person.contactsQty ?? 0 }}</td>
          <td>{{ person.garagesQty ?? 0 }}</td>
          <td>{{ person.associationsQty ?? 0 }}</td>
          <td>
            <div class="flex gap-1">
              <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="info"
                        (onClick)="navigateToEdit(person.id)" />
              <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger"
                        (onClick)="confirmDelete(person)" />
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="8" class="text-center p-4">No persons found.</td>
        </tr>
      </ng-template>
    </p-table>

  </div>
  <app-confirm-dialog />
</div>
